# Local Development Docker Compose
# Use this file for local development on your machine
#
# Local evaluation only. Supply your own credentials in the ignored .env file.
#
# Key features:
# - Reads from .env file
# - Port 8000 on localhost only
# - Includes dev dependencies (INSTALL_DEV=true)
# - Source code mounted for live reload
# - Uvicorn --reload enabled

version: "3.8"

services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: metrics-db
    environment:
      - POSTGRES_USER=metrics_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a fresh URL-safe value}
      - POSTGRES_DB=metrics_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - metrics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics_user -d metrics_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    pull_policy: build
    container_name: metrics-app
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://metrics_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/metrics_db
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:10.4.5
    container_name: metrics-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:?set GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    pull_policy: build
    container_name: metrics-api
    env_file: .env
    environment:
      - RUN_ENV=local
      - AUTO_RUN_MIGRATIONS=true
      - DATABASE_URL=postgresql+psycopg://metrics_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/metrics_db
    command: uvicorn src.devops_metrics.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # Optional: one-shot migration helper (run with profile 'tools')
  db-migrate:
    build: .
    container_name: metrics-db-migrate
    environment:
      - DATABASE_URL=postgresql+psycopg://metrics_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/metrics_db
      - RUN_ENV=local
    command: python scripts/migrate.py
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

  cleanup:
    build: .
    container_name: metrics-cleanup
    environment:
      - RUN_ENV=local
      - EXPORTS_RETENTION_DAYS=${EXPORTS_RETENTION_DAYS:-30}
    volumes:
      - .:/app
    command: ["python", "scripts/cleanup_exports.py", "--path", "/app/exports", "--retention-days", "${EXPORTS_RETENTION_DAYS:-30}"]
    profiles:
      - tools

volumes:
  metrics_pgdata:
    driver: local
  grafana_data:
    driver: local
